;;;; jwc Board-Specific-Not \/\/
;;;;

;;;; NOTE: https://registry.platformio.org/platforms/platformio/espressif32/versions
;;;; * https://github.com/platformio/platform-espressif32/releases
;;;;
;;;; jwc 25-0504-0700 y platform = espressif32 @6.5.0
;;;; jwc 25-0605-0820 undefined reference to `VORBISDecoder_FreeBuffers()' \/ platform = espressif32 @6.10.0
;;;; jwc 25-0605-0830 Still undefined references, then try another simpler app: platform = espressif32 @6.5.0
platform = espressif32 @6.10.0

framework = arduino
monitor_speed = 115200 ;Serial Baud Rate Setting

;;;; jwc 25-1122-0500 Serial Monitor Flags for Raw Data from Esp32
monitor_flags = 
    --no-reset
    --raw

;;;; jwc 25-0606-0800 Seems ambitious, use traditional below: upload_speed = 2000000     ;ESP32S3 USB-Serial Converter maximum 2000000bps
;;;; jwc ? upload_speed = 921600 ; 460800, 512000, 460800, 256000, 115200
;;;; jwc ? upload_speed = 115200 ; 460800, 512000, 460800, 256000, 115200
;;;; jwc 25-0606-0800 
upload_speed = 921600 ; 460800, 512000, 460800, 256000, 115200

;;;; jwc Board-Specific-Yes \/\/
;;;;
;;;;

board = lilygo_t_cameraplus_esp32s3
board_upload.flash_size = 16MB 
; board_build.memory_type = qio_opi ;Enable internal PSRAM
board_build.memory_type = qio_qspi ;Enable external PSRAM
board_build.partitions = default_16MB.csv 
;;;; jwc 25-1226-1345 WebSocket Library Dependencies (moved here for global availability)
lib_deps =
    ESP Async WebServer @ ^1.2.3
    ESPAsyncTCP @ ^1.2.2
    WebSockets @ ^2.4.0
    ArduinoJson @ ^6.21.0

build_flags = 
    -Wall ;all errors that everybody could agree on
    -Wextra ;somebody agree on
    ; -Werror ;Think of "Warning" as "Error".
    -D CORE_DEBUG_LEVEL=2 ;Debug level 0-5
    -D BOARD_HAS_PSRAM ;Enable external PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_RUNNING_CORE=1       ; Arduino Runs On Core (setup, loop)
    -D ARDUINO_EVENT_RUNNING_CORE=1 ; Events Run On Core

    ;;;; jwc * NOTE: Q. Why is there no serial data output on the "Uart" interface on my board? Is it defective and unusable?
    ;;;; jwc * NOTE: A. The default project configuration uses the USB interface as Uart0 serial output for debugging purposes. The "Uart" interface is connected to Uart0, so it won't output any data without configuration.
    ;;;; jwc * NOTE: For PlatformIO users, please open the project file "platformio.ini" and modify the option under "build_flags = xxx" from "-D ARDUINO_USB_CDC_ON_BOOT=true" to "-D ARDUINO_USB_CDC_ON_BOOT=false" to enable external "Uart" interface.
    ;;;; jwc * NOTE: For Arduino users, open the "Tools" menu and select "USB CDC On Boot: Disabled" to enable the external "Uart" interface.
    ;;;; jwc * NOTE: 
    ;;;; jwc * NOTE: Q. Why is my board continuously failing to download the program?
    ;;;; jwc * NOTE: A. Please hold down the "BOOT-0" button and try downloading the program again.

    ;;;; jwc oy  -D ARDUINO_USB_CDC_ON_BOOT=1 ;1 is to use the USB port as a serial port
    ;;;; jwc -D ARDUINO_USB_CDC_ON_BOOT=0 ;1 is to use the USB port as a serial port
    
    ;;;; jwc yyy for: default_envs = Camera_Screen_AprilTag__Serial_With_Microbit-NOW
        ;;;; -D ARDUINO_USB_CDC_ON_BOOT=0 ;1 is to use the USB port as a serial port
    ;;;; jwc * NOTE: Default/Standard Since Usually use Usb-Port/Cable for Serial-Monitor 
    ;;;; jwc   * Whenever '=0' May Need to Manually Override to Boot-Mode : Boot-Then_Reset-Then_Release_Together
    ;;;; jwc   * Whether '=1' or ='=0', USB-Port/Calbe always for Download/Flash of micro:bit
    -D ARDUINO_USB_CDC_ON_BOOT=1 ;1 is to use the USB port as a serial port

