;;;; * Summary:
;;;;   * This setting ensures your firmware is built in a way that makes debugging with breakpoints, stepping, and variable inspection as reliable as possible. It is especially useful when you want to debug issues in your code using a hardware debugger or PlatformIO’s built-in debugging tools.
;;;;     * -O0: Disables compiler optimizations. This makes debugging easier because the generated code closely matches your source code, so breakpoints and variable inspection work as expected.
;;;;     * -g: Generates debug information in the compiled output, allowing the debugger (like GDB) to map machine code back to your source code.
;;;;     * -ggdb: Generates extra debug information specifically for GDB, the GNU Debugger.
debug_build_flags = -O0 -g -ggdb


